name: RSS to Notion

on:
  schedule:
    # 每小时运行一次 (GitHub 免费版建议间隔不要低于 5-15 分钟)
    - cron: '0 * * * *'
  workflow_dispatch: # 允许手动点击运行
    inputs:
      llm_mode:
        description: '本次运行的 LLM 模式（留空用仓库变量；balance 可强制两家分摊以验证 Gemini）'
        required: false
        type: string
        default: ''
      probe_only:
        description: '只做模型连通性自检、不抓取文章（填 true）'
        required: false
        type: string
        default: 'false'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Check LLM providers
        continue-on-error: true # 自检失败不阻断抓取
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
        run: |
          python -c "from jiclaw_core import check_llm_providers; check_llm_providers()"
          python -c "from jiclaw_core import check_llm_generation; check_llm_generation()" || true

      - name: Run Script
        if: github.event.inputs.probe_only != 'true'
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          # 备用免费模型：在 Google AI Studio 申请后填入 Secret；不填则只用智谱
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
          # fallback=智谱优先、限流才切 Gemini（默认）；balance=两家轮询分摊
          LLM_MODE: ${{ github.event.inputs.llm_mode || vars.LLM_MODE || 'fallback' }}
          LLM_REQUEST_INTERVAL: ${{ vars.LLM_REQUEST_INTERVAL || '1' }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_OTHER: ${{ secrets.TELEGRAM_CHAT_ID_OTHER }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          RSS_INTERVAL_SECONDS: ${{ vars.RSS_INTERVAL_SECONDS || 3600 }}
          TIMEZONE_OFFSET: 0  # GitHub Action 使用 UTC 时间，不需要转换
        run: |
          python jiclaw.py "https://news.mit.edu/rss/topic/nanotech" "https://feeds.feedburner.com/servethehome" "https://rss.etnews.com/06.xml" "https://idw-online.de/en/pressreleasesrss?langs=en_US&category_ids=15&category_ids=13&category_ids=4&category_ids=14&category_ids=1&category_ids=7&category_ids=12&category_ids=9&category_ids=3&category_ids=5&category_ids=8&category_ids=10&field_ids=302" "http://anysilicon.com/feed" "https://www.electronicdesign.com/__rss/website-scheduled-content.xml?input=%7b%22sectionAlias%22:%22home%22%7d" "https://entegrisinc.gcs-web.com/rss/news-releases.xml" "https://www.azonano.com/syndication.axd?news-cat=24" "https://semiwiki.com/feed/" "https://www.electronicsweekly.com/feed/" "https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJeEFpRXEMGSQ5SVFJdFUNdFkNaV1dDFUkQUhFUVl9dF0M=" "https://seekingalpha.com/listing/most-popular-articles.xml" "https://ir.appliedmaterials.com/rss/news-releases.xml" "https://www.tomshardware.com/feeds.xml" "https://thelec.net/rss/S1N3.xml" "https://www.trendforce.com/feed/Semiconductors.html" "https://www.trendforce.com/feed/LED.html" scraper:semi-insights scraper:icsmart  scraper:lam-research scraper:lumentum scraper:nvidia scraper:nvidia-dev scraper:intel scraper:coherent scraper:iccsz scraper:broadcom scraper:broadcom-blog scraper:tweaktown scraper:bits-chips scraper:imec scraper:qualcomm scraper:aijiwei

