name: RSS to Notion

on:
  schedule:
    # 每小时运行一次 (GitHub 免费版建议间隔不要低于 5-15 分钟)
    - cron: '0 * * * *'
  workflow_dispatch: # 允许手动点击运行
    inputs:
      llm_mode:
        description: '本次运行的 LLM 模式（留空用仓库变量；balance 可强制两家分摊以验证 Gemini）'
        required: false
        type: string
        default: ''
      probe_only:
        description: '只做模型连通性自检、不抓取文章（填 true）'
        required: false
        type: string
        default: 'false'
      probe_seismiq:
        description: '打印 SEISMIQ webhook 的 schema 与最近写入审计（填 true，用于排查对接）'
        required: false
        type: string
        default: 'false'
      test_seismiq_write:
        description: '只测试 SEISMIQ 真实写入（配合 probe_only=true 跳过抓取，约 1 分钟）'
        required: false
        type: string
        default: 'false'

jobs:
  run-script:
    runs-on: ubuntu-latest
    # 同一分支串行执行：提交风险事件回仓库时避免两个 run 同时 push 造成冲突
    concurrency:
      group: rss-to-notion-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # 必须落在分支上（默认 detached HEAD 会导致后面 git push 失败）
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Check LLM providers
        continue-on-error: true # 自检失败不阻断抓取
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
        run: |
          python -c "from jiclaw_core import check_llm_providers; check_llm_providers()"
          python -c "from jiclaw_core import check_llm_generation; check_llm_generation()" || true

      # 本地网络到 *.workers.dev 不通（代理 502 / 直连超时），借境外 runner 探测对接信息。
      # 只打印无需鉴权的 schema 与审计，不回显任何 token。
      - name: Probe SEISMIQ webhook
        if: github.event.inputs.probe_seismiq == 'true'
        env:
          # 本仓库主 token 存在名为 SEISMIQ_WEBHOOK_SECRET 的 Secret 里（值是 Bearer token）
          SEISMIQ_WEBHOOK_TOKEN: ${{ secrets.SEISMIQ_WEBHOOK_SECRET }}
        run: |
          if [ -n "$SEISMIQ_WEBHOOK_TOKEN" ]; then
            echo "主 token 状态：已注入（值不打印）"
          else
            echo "主 token 状态：缺失（检查 Secret SEISMIQ_WEBHOOK_SECRET）"
          fi
          echo "=== GET /api/webhook/schema ==="
          curl -sS --max-time 30 -w "\n[HTTP %{http_code}]\n" \
            "https://seismiq-api.jijibot.workers.dev/api/webhook/schema" || true
          echo "=== GET /api/webhook/runs?limit=3 ==="
          curl -sS --max-time 30 -w "\n[HTTP %{http_code}]\n" \
            "https://seismiq-api.jijibot.workers.dev/api/webhook/runs?limit=3" || true

      - name: Run Script
        if: github.event.inputs.probe_only != 'true'
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          # 备用免费模型：在 Google AI Studio 申请后填入 Secret；不填则只用智谱
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          # fallback=智谱优先、限流才切 Gemini（默认）；balance=两家轮询分摊
          LLM_MODE: ${{ github.event.inputs.llm_mode || vars.LLM_MODE || 'fallback' }}
          LLM_REQUEST_INTERVAL: ${{ vars.LLM_REQUEST_INTERVAL || '1' }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_OTHER: ${{ secrets.TELEGRAM_CHAT_ID_OTHER }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          RSS_INTERVAL_SECONDS: ${{ vars.RSS_INTERVAL_SECONDS || 3600 }}
          TIMEZONE_OFFSET: 0  # GitHub Action 使用 UTC 时间，不需要转换
        run: |
          python jiclaw.py "https://news.mit.edu/rss/topic/nanotech" "https://feeds.feedburner.com/servethehome" "https://rss.etnews.com/06.xml" "https://idw-online.de/en/pressreleasesrss?langs=en_US&category_ids=15&category_ids=13&category_ids=4&category_ids=14&category_ids=1&category_ids=7&category_ids=12&category_ids=9&category_ids=3&category_ids=5&category_ids=8&category_ids=10&field_ids=302" "http://anysilicon.com/feed" "https://www.electronicdesign.com/__rss/website-scheduled-content.xml?input=%7b%22sectionAlias%22:%22home%22%7d" "https://entegrisinc.gcs-web.com/rss/news-releases.xml" "https://www.azonano.com/syndication.axd?news-cat=24" "https://semiwiki.com/feed/" "https://www.electronicsweekly.com/feed/" "https://feed.businesswire.com/rss/home/?rss=G1QFDERJXkJeEFpRXEMGSQ5SVFJdFUNdFkNaV1dDFUkQUhFUVl9dF0M=" "https://seekingalpha.com/listing/most-popular-articles.xml" "https://ir.appliedmaterials.com/rss/news-releases.xml" "https://www.tomshardware.com/feeds.xml" "https://thelec.net/rss/S1N3.xml" "https://www.trendforce.com/feed/Semiconductors.html" "https://www.trendforce.com/feed/LED.html" "https://www.theinformation.com/feed" scraper:semi-insights scraper:icsmart  scraper:lam-research scraper:lumentum scraper:nvidia scraper:nvidia-dev scraper:intel scraper:coherent scraper:iccsz scraper:broadcom scraper:broadcom-blog scraper:tweaktown scraper:bits-chips scraper:imec scraper:qualcomm scraper:aijiwei

      # 风险事件 JSONL：下游（SEISMIQ）按天拉取的结构化事件流
      # 注意用 always()，抓取中途报错也要把已抽到的事件留下来
      - name: Upload risk events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-events-${{ github.run_id }}
          path: risk_events/
          if-no-files-found: ignore
          retention-days: 30

      # 汇总成单个 latest.json，SEISMIQ 只需 GET 一个固定 raw URL
      - name: Build risk feed
        if: always()
        run: python export_risk_feed.py

      - name: Push to SEISMIQ
        # 汇总完成后推；推送失败不影响抓取与 JSONL 落盘，靠 continue-on-error 兜底。
        # probe_only + test_seismiq_write 可跳过 9 分钟抓取，只验证真实写入。
        if: ${{ always() && (github.event.inputs.probe_only != 'true' || github.event.inputs.test_seismiq_write == 'true') }}
        continue-on-error: true
        env:
          # 注意：Secret 名叫 SEISMIQ_WEBHOOK_SECRET，但里面存的是**主 token（Bearer）**，
          # 不是 HMAC 签名密钥。之前误接到签名参数导致一直「未配置 token，跳过」。
          SEISMIQ_WEBHOOK_TOKEN: ${{ secrets.SEISMIQ_WEBHOOK_SECRET }}
          # 仅当 SEISMIQ 侧确实开启签名校验时才另配此 Secret；默认不设、不发签名头
          SEISMIQ_HMAC_SECRET: ${{ secrets.SEISMIQ_HMAC_SECRET }}
        run: |
          if [ -z "$SEISMIQ_WEBHOOK_TOKEN" ]; then
            echo "跳过推送：Secret SEISMIQ_WEBHOOK_SECRET 未配置"
            exit 0
          fi
          echo "主 token 已注入（值不打印），开始写入"
          python push_to_seismiq.py
          echo "=== 写入后审计：GET /api/webhook/runs?limit=3 ==="
          curl -sS --max-time 30 -w "\n[HTTP %{http_code}]\n" \
            "https://seismiq-api.jijibot.workers.dev/api/webhook/runs?limit=3" || true

      # 把事件流提交回仓库，避免依赖会过期的 artifact。
      # latest.json 是幂等的：没有新事件时 git diff 为空，不会产生空提交。
      # 用 [skip ci] 且本工作流没有 push trigger，不会自我递归触发。
      - name: Commit risk events
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risk_events/
          if git diff --cached --quiet; then
            echo "风险事件无新增，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新风险事件流 [skip ci]"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash origin "${{ github.ref_name }}" && \
               git push origin "HEAD:${{ github.ref_name }}"; then
              echo "风险事件已推送到仓库"
              exit 0
            fi
            echo "push 冲突，第 $i 次重试"
            sleep 5
          done
          echo "推送失败；本次事件仍可从 artifact 下载"
          exit 1

